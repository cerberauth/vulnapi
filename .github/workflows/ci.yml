name: CI

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7

      - uses: cerberauth/ci/actions/go-build-test@0138d16209aaf063e2e693cf6bb9a2f7d177ac72 # main
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  race:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        run: go test -race ./...

  publish:
    needs: [build, race]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: cerberauth/ci/actions/releaser@0138d16209aaf063e2e693cf6bb9a2f7d177ac72 # main
        with:
          package-name: vulnapi
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          snapcraft-store-credentials: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          chocolatey-api-key: ${{ secrets.CHOCOLATEY_API_KEY }}
          aur-key: ${{ secrets.AUR_KEY }}
          github-token: ${{ secrets.PAT }}
