name: Scans

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GO_VERSION: "1.27"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build VulnAPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -o vulnapi main.go

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: vulnapi
          path: vulnapi
          retention-days: 1

  run-api-discovery:
    name: API Discovery
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/discoverable:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        run: |
          chmod +x vulnapi
          ./vulnapi discover api http://localhost:8080 --rate 500/s --no-progress --sqa-opt-out

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/discoverable:latest)

  run-unreachable-curl-scan:
    name: Unreachable API
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          ./vulnapi scan curl http://localhost:8080 --no-progress --sqa-opt-out

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome == 'failure' }}
        run: echo "Unreachable API found"

  run-bad-ssl-scan-curl:
    name: Bad SSL Scan ${{ matrix.challenge.name }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: true
      matrix:
        challenge:
          [
            { name: "expired", url: "https://expired.badssl.com" },
            { name: "wrong-hostname", url: "https://wrong.host.badssl.com" },
            { name: "self-signed", url: "https://self-signed.badssl.com" },
            { name: "untrusted", url: "https://untrusted-root.badssl.com" },
            { name: "revoked", url: "https://revoked.badssl.com" },
            { name: "pinning-test", url: "https://pinning-test.badssl.com" },
          ]

    steps:
      - uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          ./vulnapi scan curl ${{ matrix.challenge.url }} --no-progress --sqa-opt-out

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome == 'failure' }}
        run: echo "Bad SSL found in ${{ matrix.challenge.name }}"

  run-jwt-scans:
    name: JWT Scans
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - challenge: "jwt-alg-none-bypass"
            checkID: "alg_none"
          - challenge: "jwt-blank-secret"
            checkID: "blank_secret"
          - challenge: "jwt-kid-path-traversal"
            checkID: "kid_path_traversal"
          - challenge: "jwt-kid-sql-injection"
            checkID: "kid_sql_injection"
          - challenge: "jwt-not-verified"
            checkID: "no_verification"
          - challenge: "jwt-null-signature"
            checkID: "null_signature"
          - challenge: "jwt-weak-hmac-secret"
            checkID: "weak_secret"
          - challenge: "jwt-jwk-header-injection"
            checkID: "jwt.jwk_injection"
          - challenge: "jwt-psychic-signature"
            checkID: "jwt.psychic_signature"
          - challenge: "jwt-x5c-x5u-header-injection"
            checkID: "jwt.x5c_injection"

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest

      - name: Get JWT
        id: get-jwt
        run: echo "jwt=$(docker run --rm ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest jwt)" >> $GITHUB_OUTPUT

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          ./vulnapi scan curl http://localhost:8080 -H "Authorization: Bearer ${{ steps.get-jwt.outputs.jwt }}" --scans "${{ matrix.checkID }}" --no-progress --sqa-opt-out

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome != 'failure' }}
        run: |
          echo "Expected vulnerability not found"
          exit 1

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest)

  run-header-strong-api-key-scan:
    name: Strong API Key Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/strong-api-key:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        run: |
          chmod +x vulnapi
          ./vulnapi scan curl http://localhost:8080 -H "X-API-Key: abcdef1234" --scans "generic.accept_unauthenticated_operation" --no-progress --sqa-opt-out

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/strong-api-key:latest)

  run-header-api-key-scan:
    name: API Key in header Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/auth-not-verified:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          ./vulnapi scan curl http://localhost:8080 -H "X-API-Key: abcdef1234" --scans "generic.accept_unauthenticated_operation" --no-progress --sqa-opt-out

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome != 'failure' }}
        run: |
          echo "Expected vulnerability not found"
          exit 1

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/auth-not-verified:latest)

  run-bearer-api-key-scan:
    name: Bearer API Key Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/auth-not-verified:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          ./vulnapi scan curl http://localhost:8080 -H "Authorization: Bearer abcdef1234" --scans "generic.accept_unauthenticated_operation" --no-progress --sqa-opt-out

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome != 'failure' }}
        run: |
          echo "Expected vulnerability not found"
          exit 1

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/auth-not-verified:latest)

  run-header-strong-http-basic-scan:
    name: Strong HTTP Basic Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/strong-http-basic:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        run: |
          chmod +x vulnapi
          ./vulnapi scan curl http://localhost:8080 -H "X-API-Key: abcdef1234" --no-progress --sqa-opt-out

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/strong-http-basic:latest)

  run-http-misconfigurations-scans:
    name: HTTP Misconfigurations Scans
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - challenge: "misconfiguration.http_headers"
            url: "http://localhost:8080"
            scans: >-
              --scans "misconfiguration.http_headers_hsts_missing"
              --scans "misconfiguration.http_headers_csp_missing"
              --scans "misconfiguration.http_headers_csp_frame_ancestors_missing"
              --scans "misconfiguration.http_headers_frame_options_missing"
              --scans "misconfiguration.http_headers_content_options_missing"
              --scans "misconfiguration.http_headers_cors_missing"
              --scans "misconfiguration.http_headers_cors_wildcard"
          - challenge: "misconfiguration.http_headers"
            url: "http://localhost:8080/headers/cors-wildcard"
            scans: >-
              --scans "misconfiguration.http_headers_hsts_missing"
              --scans "misconfiguration.http_headers_csp_missing"
              --scans "misconfiguration.http_headers_csp_frame_ancestors_missing"
              --scans "misconfiguration.http_headers_frame_options_missing"
              --scans "misconfiguration.http_headers_content_options_missing"
              --scans "misconfiguration.http_headers_cors_missing"
              --scans "misconfiguration.http_headers_cors_wildcard"
          - challenge: "misconfiguration.http_headers"
            url: "http://localhost:8080/headers/csp-frame-ancestors"
            scans: >-
              --scans "misconfiguration.http_headers_hsts_missing"
              --scans "misconfiguration.http_headers_csp_missing"
              --scans "misconfiguration.http_headers_csp_frame_ancestors_missing"
              --scans "misconfiguration.http_headers_frame_options_missing"
              --scans "misconfiguration.http_headers_content_options_missing"
              --scans "misconfiguration.http_headers_cors_missing"
              --scans "misconfiguration.http_headers_cors_wildcard"
          - challenge: "misconfiguration.http_cookies"
            url: "http://localhost:8080/cookies/unsecure"
            scans: >-
              --scans "misconfiguration.http_cookies_not_http_only"
              --scans "misconfiguration.http_cookies_not_secure"
              --scans "misconfiguration.http_cookies_same_site_none"
              --scans "misconfiguration.http_cookies_without_expires"
              --scans "misconfiguration.http_cookies_without_same_site"
          - challenge: "misconfiguration.http_cookies"
            url: "http://localhost:8080/cookies/not-httponly"
            scans: >-
              --scans "misconfiguration.http_cookies_not_http_only"
              --scans "misconfiguration.http_cookies_not_secure"
              --scans "misconfiguration.http_cookies_same_site_none"
              --scans "misconfiguration.http_cookies_without_expires"
              --scans "misconfiguration.http_cookies_without_same_site"
          - challenge: "misconfiguration.http_cookies"
            url: "http://localhost:8080/cookies/samesite-none"
            scans: >-
              --scans "misconfiguration.http_cookies_not_http_only"
              --scans "misconfiguration.http_cookies_not_secure"
              --scans "misconfiguration.http_cookies_same_site_none"
              --scans "misconfiguration.http_cookies_without_expires"
              --scans "misconfiguration.http_cookies_without_same_site"
          - challenge: "misconfiguration.http_cookies"
            url: "http://localhost:8080/cookies/no-expiration"
            scans: >-
              --scans "misconfiguration.http_cookies_not_http_only"
              --scans "misconfiguration.http_cookies_not_secure"
              --scans "misconfiguration.http_cookies_same_site_none"
              --scans "misconfiguration.http_cookies_without_expires"
              --scans "misconfiguration.http_cookies_without_same_site"
          - challenge: "misconfiguration.http_method_override"
            url: "http://localhost:8080/http-method-override"
            scans: >-
              --scans "misconfiguration.http_method_override"

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/http-misconfigurations:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          if [ "${{ matrix.challenge }}" = "misconfiguration.http_method_override" ]; then
            ./vulnapi scan curl ${{ matrix.url }} -H "Authorization: Bearer valid-token" ${{ matrix.scans }} --no-progress --sqa-opt-out
          else
            ./vulnapi scan curl ${{ matrix.url }} ${{ matrix.scans }} --no-progress --sqa-opt-out
          fi

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome != 'failure' }}
        run: |
          echo "Expected vulnerability not found"
          exit 1

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/http-misconfigurations:latest)

  run-graphql-scans:
    name: GraphQL Scans
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - challenge: "graphql.introspection_enabled"
            url: "http://localhost:4000/graphql"

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 4000:4000 ghcr.io/cerberauth/api-vulns-challenges/apollo:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          ./vulnapi scan graphql ${{ matrix.url }} --scans "${{ matrix.challenge }}" --no-progress --sqa-opt-out

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome != 'failure' }}
        run: |
          echo "Expected vulnerability not found"
          exit 1

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/apollo:latest)

  run-openapi-scans:
    name: OpenAPI Scans
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        openapi:
          [
            "simple_api_key.openapi.json",
            "simple_http_bearer_jwt.openapi.json",
            "simple_http_bearer.openapi.json",
            "simple_no_scheme.openapi.json",
            "complex.openapi.json",
            "petstore.openapi.json"
          ]

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/auth-not-verified:latest

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: vulnapi

      - name: VulnAPI
        id: vulnapi
        continue-on-error: true
        run: |
          chmod +x vulnapi
          if [ "${{ matrix.openapi }}" = "simple_no_scheme.openapi.json" ]; then
            ./vulnapi scan openapi ./test/stub/${{ matrix.openapi }} --severity-threshold 0 --rate 500/s --no-progress --sqa-opt-out
          else
            ./vulnapi scan openapi ./test/stub/${{ matrix.openapi }} --rate 500/s --no-progress --sqa-opt-out
          fi

      - name: Check for vulnerabilities
        if: ${{ steps.vulnapi.outcome != 'failure' }}
        run: |
          echo "Expected vulnerability not found"
          exit 1

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/auth-not-verified:latest)
