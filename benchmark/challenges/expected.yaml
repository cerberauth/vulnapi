name: API Vulnerabilities Challenges
url: https://github.com/cerberauth/api-vulns-challenges
version: 42c408183088ebea9087af2237c7573750f48844
scans:
  - name: jwt-alg-none-bypass
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8101/
    token: docker compose run --rm --no-deps -T jwt-alg-none-bypass jwt
    args: [scan, curl, "http://127.0.0.1:8101/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: alg-none
        title: JWT accepts alg none
        check: jwt.alg_none
  - name: jwt-blank-secret
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8102/
    token: docker compose run --rm --no-deps -T jwt-blank-secret jwt
    args: [scan, curl, "http://127.0.0.1:8102/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: blank-secret
        title: JWT signed with a blank secret
        check: jwt.blank_secret
  - name: jwt-null-signature
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8103/
    token: docker compose run --rm --no-deps -T jwt-null-signature jwt
    args: [scan, curl, "http://127.0.0.1:8103/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: null-signature
        title: JWT null signature accepted
        check: jwt.null_signature
  - name: jwt-weak-hmac-secret
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8104/
    token: docker compose run --rm --no-deps -T jwt-weak-hmac-secret jwt
    args: [scan, curl, "http://127.0.0.1:8104/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: weak-secret
        title: JWT signed with a weak HMAC secret
        check: jwt.weak_secret
  - name: jwt-not-verified
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8105/
    token: docker compose run --rm --no-deps -T jwt-not-verified jwt
    args: [scan, curl, "http://127.0.0.1:8105/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: not-verified
        title: JWT signature not verified
        check: jwt.not_verified
  - name: jwt-psychic-signature
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8106/
    token: docker compose run --rm --no-deps -T jwt-psychic-signature jwt
    args: [scan, curl, "http://127.0.0.1:8106/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: psychic-signature
        title: JWT psychic signature (CVE-2022-21449)
        check: jwt.psychic_signature
  - name: jwt-hmac-confusion
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8107/
    token: docker compose run --rm --no-deps -T jwt-hmac-confusion jwt
    args: [scan, curl, "http://127.0.0.1:8107/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: hmac-confusion
        title: JWT HMAC/RSA algorithm confusion
        check: jwt.hmac_confusion
        knownMiss: https://github.com/cerberauth/vulnapi/issues/353
  - name: jwt-jwk-header-injection
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8108/
    token: docker compose run --rm --no-deps -T jwt-jwk-header-injection jwt
    args: [scan, curl, "http://127.0.0.1:8108/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: jwk-injection
        title: JWT jwk header injection
        check: jwt.jwk_injection
  - name: jwt-kid-sql-injection
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8109/
    token: docker compose run --rm --no-deps -T jwt-kid-sql-injection jwt
    args: [scan, curl, "http://127.0.0.1:8109/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: kid-sql-injection
        title: JWT kid header SQL injection
        check: jwt.kid_injection
        knownMiss: https://github.com/cerberauth/vulnapi/issues/405
  - name: jwt-kid-path-traversal
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8110/
    token: docker compose run --rm --no-deps -T jwt-kid-path-traversal jwt
    args: [scan, curl, "http://127.0.0.1:8110/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: kid-path-traversal
        title: JWT kid header path traversal
        check: jwt.kid_injection
  - name: jwt-timestamp-tampering
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8111/
    token: docker compose run --rm --no-deps -T jwt-timestamp-tampering jwt
    args: [scan, curl, "http://127.0.0.1:8111/session", -H, "Authorization: Bearer ${TOKEN}", --jwt-secret, s3cr3t-dev-key]
    issues:
      - id: timestamp-tampering
        title: JWT expiration not validated
        check: jwt.timestamp_tampering
  - name: jwt-x5c-x5u-header-injection
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8112/
    token: docker compose run --rm --no-deps -T jwt-x5c-x5u-header-injection jwt
    args: [scan, curl, "http://127.0.0.1:8112/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: x5c-injection
        title: JWT x5c header injection
        check: jwt.x5c_injection
  - name: auth-not-verified
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8113/
    args: [scan, curl, "http://127.0.0.1:8113/"]
    issues:
      - id: accept-unauthenticated
        title: Endpoint accepts unauthenticated requests
        check: discover.accept_unauthenticated
  - name: auth-unauthenticated-endpoint
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8115/openapi.json
    token: docker compose run --rm --no-deps -T auth-unauthenticated-endpoint jwt
    args: [scan, openapi, http://127.0.0.1:8115/openapi.json, --server-url, http://127.0.0.1:8115, --security-schemes, "bearerAuth=${TOKEN}"]
    issues:
      - id: authentication-bypass
        title: Operation declaring bearer authentication answers anonymous callers
        check: broken_authentication.authentication_bypass
  - name: jwt-claim-removal
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8116/
    token: docker compose run --rm --no-deps -T jwt-claim-removal jwt
    args: [scan, curl, "http://127.0.0.1:8116/", -H, "Authorization: Bearer ${TOKEN}", --jwt-secret, claim-removal-dev-key]
    issues:
      - id: claim-removal
        title: JWT accepted without registered claims
        check: jwt.claim_removal
      - id: audience
        title: JWT audience not validated
        check: jwt.audience_not_validated
  - name: jwt-scope-not-validated
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8117/
    token: docker compose run --rm --no-deps -T jwt-scope-not-validated jwt
    args: [scan, curl, -X, POST, "http://127.0.0.1:8117/orders", -H, "Authorization: Bearer ${TOKEN}", -d, '{"item": "book"}', --jwt-secret, scope-dev-key]
    issues:
      - id: scope
        title: JWT accepted without scope on a write operation
        check: jwt.scope_not_validated
  - name: jwt-missing-expiry
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8118/
    token: docker compose run --rm --no-deps -T jwt-missing-expiry jwt
    args: [scan, curl, "http://127.0.0.1:8118/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: missing-expiry
        title: JWT issued without expiry
        check: jwt.missing_expiry
  - name: jwt-long-lifetime
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8119/
    token: docker compose run --rm --no-deps -T jwt-long-lifetime jwt
    args: [scan, curl, "http://127.0.0.1:8119/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: long-lifetime
        title: JWT valid for a year
        check: jwt.long_lifetime
  - name: jwt-issuer-not-validated
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8120/
    token: docker compose run --rm --no-deps -T jwt-issuer-not-validated jwt
    vars:
      OTHER_ISSUER_TOKEN: docker compose run --rm --no-deps -T jwt-issuer-not-validated other-issuer-jwt
    args: [scan, curl, "http://127.0.0.1:8120/", -H, "Authorization: Bearer ${TOKEN}", --jwt-other-issuer-token, "${OTHER_ISSUER_TOKEN}"]
    issues:
      - id: issuer
        title: JWT of another tenant accepted
        check: jwt.issuer_not_validated
  - name: jwt-timestamp-tampering expired token
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8111/session
    token: >-
      sh -c 'b64(){ openssl base64 -A | tr "+/" "-_" | tr -d "="; }; h=$(printf "{\"alg\":\"HS256\",\"typ\":\"JWT\"}" | b64); p=$(printf "{\"sub\":\"benchmark\",\"iat\":%d,\"exp\":%d}" $(($(date +%s)-7200)) $(($(date +%s)-3600)) | b64); s=$(printf "%s.%s" "$h" "$p" | openssl dgst -sha256 -hmac s3cr3t-dev-key -binary | b64); echo "$h.$p.$s"'
    args: [scan, curl, "http://127.0.0.1:8111/session", -H, "Authorization: Bearer ${TOKEN}", --jwt-secret, s3cr3t-dev-key]
    issues:
      - id: expired-accepted
        title: Expired JWT accepted
        check: jwt.expired_accepted
  - name: tls-certificate-misconfiguration
    setup:
      - curl -sS -k -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 https://127.0.0.1:8121/
    args: [scan, curl, "https://127.0.0.1:8121/", -k]
    issues:
      - id: untrusted
        title: Self-signed certificate
        check: tls.certificate_untrusted
      - id: expired
        title: Expired certificate
        check: tls.certificate_expired
      - id: hostname
        title: Certificate issued for another host
        check: tls.certificate_hostname_mismatch
  - name: tls-http-accepted
    setup:
      - curl -sS -k -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 https://127.0.0.1:8122/
    args: [scan, curl, "https://127.0.0.1:8122/", -k]
    issues:
      - id: http-accepted
        title: Plain HTTP served without redirect
        check: tls.http_accepted
  - name: tls-weak-dh
    setup:
      - curl -sS -k -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 https://127.0.0.1:8123/
    args: [scan, curl, "https://127.0.0.1:8123/", -k]
    issues:
      - id: weak-dh
        title: Only 1024-bit finite-field DH key exchange
        check: tls.forward_secrecy_missing
  - name: proxy-tls-misconfiguration
    setup:
      - curl -sS -k -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 https://127.0.0.1:8124/
    args: [scan, curl, "https://127.0.0.1:8124/", -k]
    issues:
      - id: deprecated-protocol
        title: TLS 1.0 and 1.1 accepted
        check: tls.protocol_deprecated
        knownMiss: https://github.com/cerberauth/proxyaudit/pull/38
      - id: weak-cipher
        title: 3DES and non-forward-secret CBC suites accepted
        check: tls.cipher_weak
  - name: http-misconfigurations /http-method-override
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/http-method-override", -H, "Authorization: Bearer valid-token"]
    issues:
      - id: method-override
        title: HTTP method override accepted
        check: misconfiguration.http_method_override
  - name: http-misconfigurations /headers/cors-wildcard
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/headers/cors-wildcard"]
    issues:
      - id: cors-wildcard
        title: CORS allows any origin
        check: misconfiguration.http_headers_cors_wildcard
  - name: http-misconfigurations /headers/csp-frame-ancestors
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/headers/csp-frame-ancestors"]
    issues:
      - id: csp-frame-ancestors
        title: CSP frame-ancestors allows any framing origin
        check: misconfiguration.http_headers_csp_frame_ancestors_missing
        knownMiss: https://github.com/cerberauth/vulnapi/issues/316
  - name: http-misconfigurations /cookies/unsecure
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/cookies/unsecure"]
    issues:
      - id: cookie-not-secure
        title: Cookie without Secure
        check: misconfiguration.http_cookies_not_secure
  - name: http-misconfigurations /cookies/not-httponly
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/cookies/not-httponly"]
    issues:
      - id: cookie-not-httponly
        title: Cookie without HttpOnly
        check: misconfiguration.http_cookies_not_http_only
  - name: http-misconfigurations /cookies/samesite-none
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/cookies/samesite-none"]
    issues:
      - id: cookie-samesite-none
        title: Cookie with SameSite=None
        check: misconfiguration.http_cookies_same_site_none
  - name: http-misconfigurations /cookies/no-expiration
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/cookies/no-expiration"]
    issues:
      - id: cookie-no-expiration
        title: Cookie without expiration
        check: misconfiguration.http_cookies_without_expires
