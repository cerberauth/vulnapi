  - name: jwt-timestamp-tampering
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8111/
    token: docker compose run --rm --no-deps -T jwt-timestamp-tampering jwt
    args: [scan, curl, "http://127.0.0.1:8111/session", -H, "Authorization: Bearer ${TOKEN}", --jwt-secret, s3cr3t-dev-key]
    issues:
      - id: timestamp-tampering
        title: JWT expiration not validated
        check: jwt.timestamp_tampering
  - name: jwt-x5c-x5u-header-injection
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8112/
    token: docker compose run --rm --no-deps -T jwt-x5c-x5u-header-injection jwt
    args: [scan, curl, "http://127.0.0.1:8112/", -H, "Authorization: Bearer ${TOKEN}"]
    issues:
      - id: x5c-injection
        title: JWT x5c header injection
        check: jwt.x5c_injection
  - name: auth-not-verified
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8113/
    args: [scan, curl, "http://127.0.0.1:8113/"]
    issues:
      - id: accept-unauthenticated
        title: Endpoint accepts unauthenticated requests
        check: discover.accept_unauthenticated
  - name: http-misconfigurations /http-method-override
    setup:
      - curl -sS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8114/
    args: [scan, curl, "http://127.0.0.1:8114/http-method-override", -H, "Authorization: Bearer valid-token"]
    issues:
